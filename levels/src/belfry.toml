# Belfry, cell [8, 6] 2x2. Its floor is Market_Square's ceiling: the opening is tiles x 28..31 of
# row 21 (world tile columns 188..191, at y = 8 cells), and Market_Square must leave those four
# ceiling tiles open and put a platform below them. The chimney (x 8..12, rows 0..5) is
# the Clocktower_Stair's bottom: the stair keeps the same columns open.
# Lantern Shard 4 belongs on the ledge at x 34..38, row 6, out of reach until the Wickline (M11):
# add a Grant of "shard" at (36, 5) then, not before.

[entities.l]
type = "Lamp"
[entities.b]
type = "Bell"
[entities.w]
type = "WispEater"
[entities.q]
type = "Quill"
fields = { Unless = "quill_stage>=1" }
[entities.s]
type = "Signpost"
fields = { Text = "belfry_hook" }
[entities.e]
type = "Ember"
