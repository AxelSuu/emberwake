# Entity types and level fields of the generated LDtk project. Sizes in px; pivot (0, 0) is the
# top-left corner, (0.5, 1) the bottom centre. Field types: Bool, Int, Float, String, EntityRef.

[level_fields]
Generated = { type = "Bool", default = false, doc = "Compiled from levels/src; rebuilt by --merge" }
Backdrop = { type = "String", default = "cavern", doc = "Preset in content/backdrops.toml" }
Area = { type = "String", default = "quarter", doc = "Area in content/areas.toml" }
Music = { type = "String", default = "", doc = "Stem set; empty plays the area's" }

[entities.PlayerStart]
color = "#f9c22b"
doc = "Spawn point; after a hazard death, the one nearest the room's entrance"

[entities.Door]
color = "#966c6c"
size = [16, 48]
pivot = [0.0, 0.0]
resizable = true
doc = "Solid while closed; opens while its sources are on"
fields.Mode = { type = "String", default = "any", doc = "any or all of its sources" }
fields.Invert = { type = "Bool", default = false, doc = "Open while unpowered instead" }

[entities.Lever]
color = "#fb6b1d"
doc = "Interact to switch its targets"
fields.Targets = { type = "EntityRef", array = true }
fields.Mode = { type = "String", default = "toggle", doc = "toggle, momentary or once" }

[entities.PressurePlate]
color = "#ab947a"
resizable = true
doc = "On while something stands on it"
fields.Targets = { type = "EntityRef", array = true }

[entities.Beacon]
color = "#fbff86"
doc = "Relight to save and set the continue point"

[entities.Lamp]
color = "#fbb954"
size = [16, 32]
pivot = [0.5, 1.0]
doc = "A dead lamp post: a swing lights it, a Wisp-eater snuffs it unless its beacon is lit"
fields.Beacon = { type = "EntityRef", doc = "The beacon that holds it once both are lit" }

[entities.Ember]
color = "#ea4f36"
pivot = [0.5, 0.5]
doc = "Collectible"
fields.Value = { type = "Int", default = 1 }

[entities.Grant]
color = "#fbff86"
pivot = [0.5, 1.0]
doc = "Touch to receive an ability or item from content/grants.toml"
fields.Thing = { type = "String", default = "shard", doc = "A key of content/grants.toml" }
fields.Count = { type = "Int", default = 1 }

[entities.Lightform]
color = "#8ff8e2"
size = [32, 8]
pivot = [0.0, 0.0]
resizable = true
doc = "A one-way platform that exists only while light reaches it"

[entities.Brazier]
color = "#f9c22b"
doc = "Lit by a swing or a flare; then a light and an on switch for good"
fields.Targets = { type = "EntityRef", array = true }
fields.Lit = { type = "Bool", default = false, doc = "Placed already lit" }

[entities.Photocell]
color = "#8ff8e2"
doc = "On while the light at it reaches the threshold"
fields.Targets = { type = "EntityRef", array = true }
fields.Threshold = { type = "Float", default = 0.4, doc = "Light level, 0 to 1" }
fields.Sealed = { type = "Bool", default = false, doc = "Dark until a casing breaks (the Lamprey breaks them)" }

[entities.Bell]
color = "#fbb954"
doc = "Swing to ring: stuns nearby enemies and pulses its targets"
fields.Targets = { type = "EntityRef", array = true }

[entities.Clockrat]
color = "#b33831"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Patrols, turns at ledges, charges at the player on sight"

[entities.Gloomcrawler]
color = "#45293f"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Shadow creature: burns in light and flees strong light"

[entities.WispEater]
color = "#8ff8e2"
size = [16, 16]
pivot = [0.5, 0.5]
doc = "Flier drawn to light; swoops at the player"

[entities.DripLurker]
color = "#6b3e75"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Hangs from the ceiling above it; drops on the player below when its spot is dark"

[entities.Gearbug]
color = "#a24b6f"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Patrols behind an armored front and vents on a cycle; pogo its back"

[entities.ClockratKing]
color = "#b33831"
size = [32, 32]
pivot = [0.5, 1.0]
doc = "Elite: armored but for its crown; charges, calls rats to the RatSpawn markers of its room, topples when hit from above"

[entities.RatSpawn]
color = "#966c6c"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Where a Clockrat King's rats appear"

[entities.Lamprey]
color = "#8ff8e2"
size = [32, 16]
pivot = [0.5, 0.5]
doc = "Boss: its head at the water line of its arena (the room); hunts the brightest light"

[entities.Tinker]
color = "#fbb954"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "NPC who talks and sells upgrades for embers"

[entities.Hesper]
color = "#fdcbb0"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Keeper Hesper: explains the Quarter and rewards rescued Lost Lights"

[entities.Quill]
color = "#ab947a"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Quill the cartographer: sells maps"

[entities.Goal]
color = "#30e1b9"
size = [16, 48]
pivot = [0.0, 0.0]
resizable = true
doc = "Trial finish line"

[entities.FlagSwitch]
color = "#fbff86"
fields.Condition = { type = "String", default = "" }
fields.Targets = { type = "EntityRef", array = true }
doc = "Powers its targets while a save flag condition holds"

[entities.SetFlag]
color = "#8ff8e2"
size = [16, 16]
resizable = true
fields.Flag = { type = "String", default = "" }
fields.Value = { type = "Int", default = 1 }
fields.Mode = { type = "String", default = "set" }
doc = "Sets a flag when the player enters"

[entities.Signpost]
color = "#ab947a"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Shows a string with the player's keys while they stand near"
fields.Text = { type = "String", default = "", doc = "Key suffix of the string sign.<Text>" }

[entities.Echo]
color = "#8ff8e2"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Interact to watch a lamplighter's last moments: a ghost replay and a line of text"
fields.Id = { type = "String", default = "", doc = "Names content/echoes/<Id>.json and the string echo.<Id>" }

[entities.LostLight]
color = "#fbb954"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "A spirit that follows the player to a beacon and is rescued there"
fields.Id = { type = "String", default = "", doc = "Names the flag lost_light_<Id>" }

[entities.TrialDoor]
color = "#30e1b9"
size = [16, 32]
pivot = [0.5, 1.0]
doc = "Interact to unlock a Trial in the menu and start it"
fields.Trial = { type = "String", default = "", doc = "A key of content/trials.toml" }

# Fields every entity type has. Conditions use the dialogue syntax; has.<thing> reads abilities
# (1 or 0) and item counts. See docs/specs/world-flags.md.
[entity_fields]
Requires = { type = "String", doc = "Condition for the entity to be in the world" }
Unless = { type = "String", doc = "Condition that takes the entity out of the world" }

[entities.CrackedWall]
color = "#966c6c"
resizable = true
doc = "Solid until struck by the lantern"

[entities.Crate]
color = "#cd683d"
doc = "Solid breakable; drops embers"
fields.Embers = { type = "Int", default = 2 }

[entities.Pot]
color = "#e6904e"
doc = "Breakable; drops embers"
fields.Embers = { type = "Int", default = 1 }

[entities.CrumblingPlatform]
color = "#b33831"
size = [32, 8]
resizable = true
doc = "One-way platform that crumbles under the player"

[entities.Encounter]
color = "#e83b3b"
size = [64, 48]
pivot = [0.0, 0.0]
resizable = true
doc = "Arena zone: the player's entry shuts its Doors and starts its waves; clearing powers its Targets"
fields.Doors = { type = "EntityRef", array = true, doc = "Doors shut while it runs" }
fields.Targets = { type = "EntityRef", array = true, doc = "Powered once cleared" }

[entities.WaveSpawn]
color = "#e83b3b"
size = [16, 16]
pivot = [0.5, 1.0]
doc = "Where an enemy of its Kind appears in its Wave of an Encounter"
fields.Encounter = { type = "EntityRef", doc = "The Encounter in this room" }
fields.Wave = { type = "Int", default = 1, doc = "From 1, without gaps" }
fields.Kind = { type = "String", default = "clockrat", doc = "An enemy prefab: clockrat, gearbug, clockrat_king..." }
