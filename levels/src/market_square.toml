# Market_Square, cell [8, 8] 4x2, the hub. West (col 0, rows 6 to 8, floor row 9) is the
# Tinkers_Nook's barred door, which the lever w opens for good. Floor tiles x 8..15 are a one-way
# over the Photocell_Gallery's top. Ceiling tiles x 28..31 open into the Belfry; the ladder of
# one-ways climbs there. East (col 79, rows 6 to 8, floor row 9) is the Trial_Gate.
# The Great Lamp G is kindled after the Lamprey (story beat great_lamp); the Tinker t keeps a
# stall here from then on.
# The tunnel under the east terrace (rows 16 to 18, floor row 19) leads to the Sluice; the grate,
# a one-way in the floor at x 44..47, drops into the Cistern_Gate.
fields = { Backdrop = "ruins" }

[entities.w]
type = "Lever"
fields = { Targets = ["Tinkers_Nook:d"], Mode = "once" }
[entities.k]
type = "Beacon"
[entities.a]
type = "Lamp"
fields = { Beacon = "k" }
[entities.h]
type = "Hesper"
fields = { Unless = "hesper_stage>=1" }
[entities.H]
type = "Hesper"
fields = { Requires = "hesper_stage>=1" }
[entities.q]
type = "Quill"
fields = { Requires = "quill_stage>=1", Unless = "quill_stage>=2" }
[entities.s]
type = "Signpost"
fields = { Text = "square_hub" }
[entities.g]
type = "Signpost"
fields = { Text = "square_great_lamp" }
[entities.G]
type = "GreatLamp"
[entities.t]
type = "Tinker"
fields = { Requires = "great_lamp" }
[entities.e]
type = "Ember"
