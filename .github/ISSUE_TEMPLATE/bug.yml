name: Bug
description: Something behaves wrong
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what should have happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps or replay file to reproduce
  - type: input
    id: version
    attributes:
      label: Version / commit and platform (desktop, web)
