[dialogue.tinker]
hello = "Ännu en lyktgubbe! Akta dig för mörkret, vän. Jag är Fixaren. Jag lagar det tidvattnet lämnade kvar."
welcome_back = "Tillbaka igen? Lyktorna tackar dig."
ask_shop = "Vad säljer du?"
ask_city = "Vad hände med den här staden?"
bye = "Hejdå."
city = "Ljuset slocknade på en gång, och vattnet steg efteråt. Fyrar brinner fortfarande på sina håll. Hitta dem, så återvänder färgerna."
shop = "Glöd är bra valuta. Titta bland mina varor."
thanks = "Kom tillbaka när din lykta börjar ta slut."

[dialogue.hesper]
hello = "Ett ljus, äntligen. Jag är Hesper, väktare av den här fyren. Jag höll den brinnande tills natten då allt slocknade. Nu håller jag den åt dig."
welcome_back = "Fyren är varm. Vila när du måste, lyktgubbe."
lit = "Stora lampan brinner. Jag har inte sett gatorna så varma sedan före mörkret. Fråga vad du vill."
ask_lamps = "Hur kommer jag ner till cisternen?"
ask_lights = "Jag hittade ett förlorat ljus."
ask_road = "Vad finns bortom Stora lampan?"
bye = "Adjö."
lamps = "Vägen ner är stängd tills båda kvarterslamporna är tända, en i klocktornet och en vid sluss. Tänd dem så öppnas gallret."
road = "En väg upp till Mässingsträdgårdarna. Du behöver ett sätt över gapet, en lina att haka i lamporna. Kom tillbaka när du har en."
pay1 = "Du tog ett hem. Små ting går förlorade i mörkret. Ta den här glöden, med mitt tack."
pay2 = "Ett andra ljus, tryggt vid min fyr. Här, en pung till dina blossar. Den var en lyktgubbes en gång."
pay3 = "Tre ljus hemma! Ta den här oljeflaskan. Den håller din lykta brinnande längre."
lights_wait = "Det finns fler förlorade ljus i kvarteret. Led dem till en fyr så väntar de här hos mig."
lights_done = "Alla tre är i säkerhet. Kvarteret är skyldigt dig mer än jag kan betala."

[dialogue.quill]
hello = "Hoo. En besökare, och med lykta. Jag är Quill. Jag ritar kartor, och jag ritar dem sanna."
welcome_back = "Hoo. Redan tillbaka? Mina kartor är fortfarande sanna."
square = "Hoo. Klocktornet blev för högljutt, så jag flyttade till torget. Kartorna följde med."
road = "Hoo. Jag vandrar vägen till Mässingsträdgårdarna nu. Någon måste kartlägga den, och mina kugghjul är inte vad de var."
