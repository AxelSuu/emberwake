ask_who = "Vem är du?"
ask_road = "Vad finns på den här vägen?"
bye = "Adjö."
about = "En urverksuggla, uppdragen av en hand som länge är borta. Jag tickade vidare, så jag kartlägger det tidvattnet inte har sopat bort."
