# What each shop sells, for embers. Each purchase raises the price by `step`. An item counts how
# many were bought in the save flag `flag` (the game applies them when it spawns the player), or,
# with `grant`, in the inventory entry of that name in grants.toml.
# Names are strings: shop.title.<shop> and shop.<item>.name.

[tinker.items.hp]
price = 10
step = 10
max = 3
flag = "up_hp"

[tinker.items.oil]
price = 8
step = 6
max = 4
flag = "up_oil"

[quill.items."map.quarter"]
price = 30
grant = "map.quarter"
