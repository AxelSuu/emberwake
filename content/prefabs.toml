# Entity templates. An LDtk entity spawns the prefab named after its identifier in snake_case
# (PressurePlate -> pressure_plate). `components` gives field values (missing ones use code
# defaults), `fields` maps LDtk fields to "Component.field", and `persist` lists components saved
# per entity. Every spawned entity also gets Identity (iid, room) and Body (its LDtk rect).
# Check with `uv run python -m tools.levels validate`.

[player_start]

[door]
fields = { Mode = "Receiver.mode", Invert = "Receiver.invert" }
[door.components]
Sprite = { image = "door", active_image = "door_open" }
Receiver = {}
Door = {}

[lever]
fields = { Targets = "Switch.targets", Mode = "Switch.mode" }
persist = ["Switch"]
[lever.components]
Sprite = { image = "lever", active_image = "lever_on" }
Interactable = { prompt = "pull" }
Switch = {}

[pressure_plate]
fields = { Targets = "Switch.targets" }
[pressure_plate.components]
Sprite = { image = "plate", active_image = "plate_down" }
Trigger = {}
Switch = { mode = "momentary" }
PressurePlate = {}

[beacon]
persist = ["Beacon"]
[beacon.components]
Sprite = { image = "beacon", active_image = "beacon_lit" }
Interactable = { prompt = "relight" }
Beacon = {}

[lamp]
fields = { Beacon = "Shelter.beacon" }
persist = ["Lamp"]
[lamp.components]
Sprite = { image = "lamp", active_image = "lamp_lit" }
Strikeable = {}
Lamp = {}
Shelter = {}

[ember]
fields = { Value = "Pickup.value" }
[ember.components]
Sprite = { image = "ember" }
Pickup = {}

[grant]
fields = { Thing = "Grant.thing", Count = "Grant.count" }
[grant.components]
Sprite = { image = "grant" }
Grant = {}

[lightform]
[lightform.components]
Sprite = { image = "lightform", active_image = "lightform_lit" }
Lightform = {}

[brazier]
fields = { Targets = "Switch.targets", Lit = "Brazier.lit" }
persist = ["Brazier", "Switch"]
[brazier.components]
Sprite = { image = "brazier", active_image = "brazier_lit" }
Strikeable = {}
Brazier = {}
Switch = {}

[photocell]
fields = { Targets = "Switch.targets", Threshold = "Photocell.threshold" }
[photocell.components]
Sprite = { image = "photocell", active_image = "photocell_on" }
Photocell = {}
Switch = {}

[bell]
fields = { Targets = "Switch.targets" }
[bell.components]
Sprite = { image = "bell", active_image = "bell_ring" }
Strikeable = {}
Bell = {}
Switch = {}

[clockrat]
[clockrat.components]
Sprite = { image = "clockrat" }
Brain = { kind = "clockrat" }

[gloomcrawler]
[gloomcrawler.components]
Sprite = { image = "gloomcrawler" }
Brain = { kind = "gloomcrawler" }

[wisp_eater]
[wisp_eater.components]
Sprite = { image = "wisp_eater" }
Brain = { kind = "wisp_eater" }

[drip_lurker]
[drip_lurker.components]
Sprite = { image = "drip_lurker", active_image = "drip_lurker_hidden" }
Brain = { kind = "drip_lurker" }

[gearbug]
[gearbug.components]
Sprite = { image = "gearbug", active_image = "gearbug_open" }
Brain = { kind = "gearbug" }

[clockrat_king]
[clockrat_king.components]
Sprite = { image = "clockrat_king", active_image = "clockrat_king_down" }
Brain = { kind = "clockrat_king" }
LightSource = { radius = 88.0, color = "#f9c22b" }

[rat_spawn]
[rat_spawn.components]
RatSpawn = {}

[tinker]
[tinker.components]
Sprite = { image = "tinker" }
Interactable = { prompt = "talk" }
Npc = { dialogue = "tinker" }

[goal]
[goal.components]
Sprite = { image = "goal" }
Goal = {}

[cracked_wall]
[cracked_wall.components]
Sprite = { image = "cracked_wall" }
Breakable = { blocks = true }
Strikeable = { solid = true }

[crate]
fields = { Embers = "Breakable.embers" }
[crate.components]
Sprite = { image = "crate" }
Breakable = { blocks = true, embers = 2 }
Strikeable = { solid = true }

[pot]
fields = { Embers = "Breakable.embers" }
[pot.components]
Sprite = { image = "pot" }
Breakable = { embers = 1 }
Strikeable = {}

[crumbling_platform]
[crumbling_platform.components]
Sprite = { image = "crumbling_platform", active_image = "crumbling_platform_gone" }
Crumble = {}

[flag_switch]
fields = { Condition = "FlagSwitch.condition", Targets = "FlagSwitch.targets" }
[flag_switch.components]
FlagSwitch = {}

[set_flag]
fields = { Flag = "SetFlag.flag", Value = "SetFlag.value", Mode = "SetFlag.mode" }
[set_flag.components]
Trigger = {}
SetFlag = {}
