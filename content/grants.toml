# What the player can find or be given (a Grant pickup, or the dialogue action give:<id>).
# `kind` is ability or item; items stack up to `max`. Names are strings: grant.<id>.name.
# Effects: every 3 shards add 1 health, each oil flask 20 flame, each flare pouch 1 flare.

[dash]
kind = "ability"

[flare]
kind = "ability"

[shard]
kind = "item"
max = 12

[oil_flask]
kind = "item"
max = 6

[flare_pouch]
kind = "item"
max = 4
